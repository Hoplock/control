# The seeded database every console screen's browser checks work against
# (0050). `hoplock-control seed` writes it; the north- and south-bound APIs
# then move it into the states each screen must show (e2e/global-setup.ts).
# A later phase adds its screen's data here, never through a route the server
# binds for tests (docs/PROTOCOL.md §3).
#
# Three operators sign in by break-glass, one per role the RBAC harness
# asserts: admin, auditor (reads everything, changes nothing) and
# fleet-admin. Their passwords are fixture data, not secrets.
subjects:
  - id: ada
    display_name: Ada Admin
    source: local
    principals: [ada]
    password: e2e-admin-password
  - id: avery
    display_name: Avery Auditor
    source: local
    principals: [avery]
    password: e2e-auditor-password
  - id: fenn
    display_name: Fenn Fleet
    source: local
    principals: [fenn]
    password: e2e-fleet-password
  # Explain and Audit (0051): the subjects the sessions are decided about.
  # Neither signs in to the console.
  - id: grace
    display_name: Grace Ops
    source: local
    principals: [grace]
    groups: [sre]
  - id: mallory
    display_name: Mallory Outside
    source: local
    principals: [mallory]
  # Inventory (0054): identities in groups from both doors, a machine, and
  # one the mutation test removes. None signs in to the console.
  - id: lin
    display_name: Lin Payments
    source: local
    principals: [lin]
    groups: [payments, sre]
    claims: {team: payments, region: eu}
  - id: noor
    display_name: Noor Contractor
    source: oidc-acme
    principals: [noor@acme.example]
    groups: [contractors]
  - id: svc-deploy
    display_name: Deploy pipeline
    source: local
    principals: [svc-deploy]
    groups: [deployers]
  - id: temp-intern
    display_name: Temporary Intern
    source: local
    principals: [temp-intern]

# Explain and Audit (0051): the hosts the fixture's sessions reach. A label
# lives on the target, which is what the blocked-command view joins on.
targets:
  - { id: db-01, hostname: db-01.core.internal, zone: core, labels: {env: prod, kind: db} }
  - { id: vault-01, hostname: vault-01.dmz.internal, zone: dmz, labels: {env: prod, kind: vault} }
  - { id: build-01, hostname: build-01.core.internal, zone: core, labels: {env: dev, kind: build} }
  # Inventory (0054): a labelled estate the target list filters, and one the
  # mutation test removes.
  - { id: api-01, hostname: api-01.core.internal, zone: core, labels: {env: prod, kind: api, team: payments} }
  - { id: cache-01, hostname: cache-01.edge.internal, zone: edge, labels: {env: staging, kind: cache} }
  - { id: scratch-01, hostname: scratch-01.core.internal, zone: core, labels: {env: dev} }

# Fleet (0050): one proxy per state the screen must show.
#   px-core-01      live, applied and caught up, holds relay registrations
#   px-core-02      live, pending_restart (settings waiting on a restart)
#   px-dmz-03       live, rejected the document (last_error)
#   px-dmz-04       live, fetch_failed (an outage, never a deny)
#   px-edge-05      live, applied an older document: a rollout in progress
#   px-edge-06      live, has never reported its configuration
#   px-edge-07      enrolled, never heard from: unreachable (the partial gap)
#   px-old-08       withdrawn: revoked
#   px-spare-09     live; the RBAC harness withdraws it as fleet-admin
# Each key is fixture material: a blob nothing verifies against (the console
# reads none of it); seed requires one per proxy.
proxies:
  # px-core-01's edge into the DMZ is what makes a session to the vault two
  # hops (0051).
  - id: px-core-01
    zone: core
    heartbeat: true
    relays: [px-dmz-03, px-dmz-04]
    key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtY29yZS0wMQ== }
    edges:
      - { to_zone: dmz, direction: dial, address: px-dmz-03.dmz.internal:2222, next_proxy_id: px-dmz-03, cost: 1 }
  - { id: px-core-02, zone: core, heartbeat: true, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtY29yZS0wMg== } }
  - { id: px-dmz-03, zone: dmz, heartbeat: true, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtZG16LTAz } }
  - { id: px-dmz-04, zone: dmz, heartbeat: true, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtZG16LTA0 } }
  - { id: px-edge-05, zone: edge, heartbeat: true, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtZWRnZS0wNQ== } }
  - { id: px-edge-06, zone: edge, heartbeat: true, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtZWRnZS0wNg== } }
  - { id: px-edge-07, zone: edge, heartbeat: false, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtZWRnZS0wNw== } }
  - { id: px-old-08, zone: edge, heartbeat: false, state: revoked, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtb2xkLTA4 } }
  - { id: px-spare-09, zone: core, heartbeat: true, key: { type: ssh-ed25519, blob: aG9wbG9jay1lMmUtZml4dHVyZS1rZXktcHgtc3BhcmUtMDk= } }

# The policy Explain's sessions are decided under (0051).
policy:
  file: policy.yaml

# A supervisor's credential (M19, 0051): a north-bound token whose principal
# is a supervisor's, so the chrome shows the supervised badge and the audit
# view has a supervisor's acts to show. Fixture data, not a secret.
api_tokens:
  - id: sup-acme-ops
    display_name: Acme Managed Ops
    secret: e2e-supervisor-token
    roles: [admin]

# Each reporting proxy's own south-bound credential, presented as
# `default.<secret>`: the fixture reports configuration as the proxy would.
tokens:
  - { secret: e2e-px-core-01, proxy_id: px-core-01, label: e2e }
  - { secret: e2e-px-core-02, proxy_id: px-core-02, label: e2e }
  - { secret: e2e-px-dmz-03, proxy_id: px-dmz-03, label: e2e }
  - { secret: e2e-px-dmz-04, proxy_id: px-dmz-04, label: e2e }
  - { secret: e2e-px-edge-05, proxy_id: px-edge-05, label: e2e }
