# The server the console's browser checks run against (0050, DESIGN.md §10).
# serve.sh writes @DSN@ from HOPLOCK_E2E_DSN. Plain HTTP on loopback only, so
# the session cookie drops Secure; nothing else here differs from a
# deployment an operator would run, except `e2e_directory`, which is the
# fixture host's own section (host/main.go): the directory its identity sync
# provisions through Control's sink at start (0055). The host also registers
# an action handler, two sinks and two report packs (host/extensions.go, 0056).
tenant: default
listeners:
  south: 127.0.0.1:18080
  north: 127.0.0.1:18081
database:
  dsn: "@DSN@"
log:
  level: warn
north:
  insecure_cookies: true
# Long enough that what the seed heard from stays live for the whole run, so
# the fixture's health is the seed's and not the clock's.
fleet:
  heartbeat_ttl: 24h
  relay_registration_ttl: 24h
instance:
  display_name: Staging EU
# The fixture host's two sinks (0056, host/extensions.go): delivery looks for
# new records every second, so the confirming sink is caught up by the time a
# check reads it, and the failing one is retried at most every 30 s.
audit:
  sinks:
    idle_interval: 1s
    backoff_cap: 30s
console:
  stripe: teal
# The directory the fixture host's identity sync holds (0055). Two
# directories feed the tenant, `corp` and `lab`, and both call somebody
# `00u1`: two people, two subjects. Every subject id is Control's to allocate
# (`dir-…`, random), so the browser checks find them by their directory id.
#   dana       corp 00u1, active, in Payments Engineering
#   dana-lab   lab 00u1, active, in lab's Payments Engineering
#   eli        corp 00u7, deactivated (offboarded)
#   sam        corp 00u9, deactivated, and locked by an operator (inventory.ts)
#   00u4       corp, deactivated before the directory created it (record_missing)
e2e_directory:
  tenant: default
  groups:
    - { source: corp, external_id: g-payments, name: Payments Engineering }
    - { source: lab, external_id: g-payments, name: Payments Engineering }
  subjects:
    - source: corp
      external_id: 00u1
      username: dana
      display_name: Dana Directory
      email: dana@corp.example
      groups: [g-payments]
      attributes: { department: payments }
    - source: lab
      external_id: 00u1
      username: dana-lab
      display_name: Dana Lab
      groups: [g-payments]
    - source: corp
      external_id: 00u7
      username: eli
      display_name: Eli Offboarded
      deactivate: offboarded
    - source: corp
      external_id: 00u9
      username: sam
      display_name: Sam Suspended
      deactivate: security_review
  deactivated_before_create:
    - { source: corp, external_id: 00u4, reason_code: never_started }
