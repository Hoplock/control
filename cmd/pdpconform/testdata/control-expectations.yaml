# Expectations for THIS server, seeded from control-seed.yaml beside this file.
#
# It is the other half of that document: a login here that is not seeded there
# fails for a reason nobody can see in either file. Change them together.
#
# WHAT THIS FILE DESCRIBES IS A SERVER THAT IMPLEMENTS PART OF THE CONTRACT.
# Phase 0007 serves authentication, host keys, capability reports and uid
# leases, 0008 serves `/v1/authorize` and 0009 the event stream; log ingest is
# 0010. The CI leg runs the served groups by name (`-only`), and the section
# below for the rest is filled in so the file VALIDATES rather than
# because anything reads it yet — the suite refuses a file whose missing key
# would silently turn an assertion into a no-op, and that refusal is worth
# keeping. The phase that serves an endpoint replaces its section here and adds
# its group to the CI leg.
#
# The authorize routes below are decided under `control-policy.yaml`, which is
# seeded from `control-seed.yaml`. THE THREE ARE ONE DOCUMENT IN THREE PARTS.

proxy_id: proxy-1
# A DIFFERENT proxy id for the uid cases: exclusivity is per target, not per
# proxy, and a server that keyed its cursor by proxy would look perfect to a
# single-proxy suite and hand the same uid to two proxies on one host. It is
# not seeded as a fleet member because a lease needs no enrolled row — the
# suite's token is unbound, which is what lets it speak for both.
second_proxy_id: proxy-2

auth:
  cert_accept:
    login: alice
    target: host.company.com
    expect_subject: alice@example.com
    key:
      type: ssh-ed25519
      # Derived from alice's key blob in the seed file. If you change the blob,
      # change this: `ssh-keygen -lf` prints the same string.
      fingerprint: "SHA256:hycF5UA/TZli3k4QVe6d9VeX8hHei7UUMXFWOdtBqcA"
  cert_deny:
    login: alice
    key:
      type: ssh-ed25519
      fingerprint: "SHA256:ZZZZ9999nobodyhasthiskey9999ZZZZ9999nobody9"
  password_no_mfa:
    login: bob
    password: "bob-dev-password"
  password_mfa_approve:
    login: alice
    password: "alice-dev-password"
    max_polls: 20
  password_mfa_deny:
    login: mallory
    password: "mallory-dev-password"
    max_polls: 20
  password_mfa_expiry:
    login: forgetful
    password: "forgetful-dev-password"
    wait_seconds: 2
  unknown_challenge_token: "pdpconform-never-issued-this-token"

# Each route below names a rule in `control-policy.yaml` and a target in
# `control-seed.yaml`. The pairs matter most: `defaults.*.default` is a route
# that must answer WITHOUT the field and `defaults.*.set` one that must answer
# WITH it, and an assertion that only ever saw the first half would pass
# vacuously against a server that cannot express the field at all.
authorize:
  direct:
    login: alice
    subject: alice@example.com
    target: host.company.com
  nexthop:
    login: alice
    subject: alice@example.com
    target: deep.internal.company.com
    proxy_id: proxy-1
  deny:
    login: alice
    subject: alice@example.com
    target: nobody-may-reach-this.company.com
  full:
    login: alice
    subject: alice@example.com
    target: scan-target-01.company.com
  ladder:
    login: alice
    subject: alice@example.com
    target: edge-fw-01.company.com
  defaults:
    enforcement:
      default: { login: alice, subject: alice@example.com, target: host.company.com }
      set:     { login: alice, subject: alice@example.com, target: build-01.company.com }
    session_deadline:
      default: { login: alice, subject: alice@example.com, target: host.company.com }
      set:     { login: alice, subject: alice@example.com, target: scan-target-01.company.com }
    require_session_capture:
      default: { login: alice, subject: alice@example.com, target: host.company.com }
      set:     { login: alice, subject: alice@example.com, target: scan-target-01.company.com }
    concurrency:
      default: { login: alice, subject: alice@example.com, target: host.company.com }
      set:     { login: alice, subject: alice@example.com, target: automation-01.company.com }
  negotiation:
    login: alice
    subject: alice@example.com
    target: build-01.company.com
  device_fields:
    with_fields:
      login: alice
      subject: alice@example.com
      target: core-fw-01.company.com
    without_fields:
      login: alice
      subject: alice@example.com
      target: crown-fw-01.company.com

hostkeys:
  first_sighting:
    # The suite generates a fingerprint unique to the run for this target, so
    # the case grades a genuine first sighting on every run rather than only
    # the first.
    target: fresh-host.company.com
  known:
    target: host.company.com
    fingerprint: "SHA256:CCCC3333hostkey3333CCCC3333hostkey3333CCCC"

capabilities:
  target: host.company.com
  # 6h, which is `fleet.capability_report_after`'s default. Asserting the value
  # rather than leaving it at -1 is deliberate: the server owns the freshness
  # of its own record, and a server that answered nothing would be leaving the
  # interval to the proxy without having decided to.
  expect_report_after_seconds: 21600

uids:
  # Three separate targets, each suffixed per run by the suite: the cursor only
  # ever advances and is never reset, so a fixed name would grade the invariant
  # on the first run against a database and nothing at all on the second.
  target: uid-nonoverlap.company.com
  range_min: 2000000
  range_max: 2099999
  uid_count: 4096
  abandoned_leases: 2
  # This server states no `term_seconds` (the term bounds only how long the
  # proxy keeps allocating, and shortening it buys nothing), so this is the
  # whole wait for the expiry case rather than slack on top of a stated term.
  expiry_wait_seconds: 2
  floor:
    target: uid-floor.company.com
    range_min: 2500000
    range_max: 2599999
  exhaustion:
    # Three blocks wide at the uid_count above, so the cursor reaches the top
    # of the range quickly and the 409 is graded rather than timed out.
    target: uid-exhaust.company.com
    range_min: 3000000
    range_max: 3012287

logs:
  # A SEPARATE PORT, and not a `/v1` path. Nothing on `/v1` reads a record back
  # — the contract says so, because a proxy writes logs and never queries them
  # — so the priority ack's durability guarantee is observable only through a
  # path this implementation exposes outside it (phase 0010). It is bound only
  # because this file's server configures one: see audit.read_listener.
  #
  # `{record_id}` is substituted with the id the case just ingested, so the
  # assertion is that THE RECORD was found rather than that a listing happened
  # to mention it.
  read_url: "http://127.0.0.1:8083/debug/logs/{record_id}"
  # A credential of its own, because the surface is of a different kind: the
  # proxy token ships logs, and this reads everybody's.
  read_token: "pdpconform-dev-audit-token"
  batch_size: 3

events:
  proxy_id: proxy-1
  # The FALLBACK, not the bound. This server advertises
  # `heartbeat_interval_seconds` on every event it writes (upstream
  # Hoplock/proxy#56), and the suite grades that claim — both that it is kept
  # and that it is inside the contract's 10s ceiling. This key is what would
  # make a server advertising nothing gradeable, and it is kept so that a
  # regression which stopped advertising fails on the claim rather than
  # becoming ungradeable.
  heartbeat_interval_seconds: 5
  # A SEPARATE PORT, and not a `/v1` path. The contract states outright that
  # nothing on `/v1` publishes an event — an event is an operator action — so
  # the publish path is this implementation's to expose, and the south-bound
  # listener serves the contract and nothing else (M2). It is bound only
  # because this file configures one: see events.publish_listener.
  publish_url: "http://127.0.0.1:8082/debug/revoke"
  # A credential of its own, because the surface is of a different kind: the
  # proxy token authenticates a proxy asking about decisions, and this
  # publishes the kill switch.
  publish_token: "pdpconform-dev-publish-token"
  publish_body: '{"type":"cache_invalidate","all":true}'
