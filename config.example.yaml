# Hoplock Control — example configuration.
#
# Copy this file, edit it, and start the server with:
#
#     hoplock-control --config /etc/hoplock/control.yaml
#
# Decoding is strict: a key this file does not document is a startup error, not
# a silently ignored setting. Every field below is either required or has the
# default shown in its comment.

# The tenant this deployment operates as.
#
# The prototype is single-tenant and nothing in the API exposes tenancy, but
# every table carries the tenant column and every query filters on it (PLAN
# M12) — retrofitting that into a populated audit store later is a migration
# nobody wants to run. Optional; defaults to "default".
tenant: default

# The two listeners.
#
# South-bound (proxies) and north-bound (humans, CI, GitOps) never share a
# port, a middleware chain, or a credential type (PLAN M2). They are two
# fields from the first release because one field that later becomes two is a
# breaking config change. Both are required, and they must differ.
listeners:
  # Proxy-facing address, host:port. Speaks the vendored contract.
  south: 0.0.0.0:8443
  # Operator-facing address, host:port. Never route this from the south-bound
  # port: a proxy token that reaches a policy-authoring endpoint is privilege
  # escalation.
  north: 127.0.0.1:9443

# Postgres (PLAN M13). Required.
#
# The DSN normally carries a password, so keep this file out of version control
# (the repository's .gitignore already ignores config.yaml) and off any host
# where it need not be. The server never logs the DSN.
database:
  dsn: postgres://hoplock@localhost:5432/hoplock?sslmode=verify-full

# Structured logging. Optional.
log:
  # One of: debug, info, warn, error. Defaults to "info".
  level: info

# The fleet registry (PLAN M6, M17). Optional; every field has the default
# shown.
#
# These numbers decide what "stale" means, and stale is a routing decision: a
# proxy that has not been heard from is not a routing option, and routing
# through one is an outage the user experiences as a hang. They are
# configurable because the right values depend on how often your proxies
# heartbeat and how much loss your estate has. A key you leave out — or set to
# zero — takes its default: `0s` cannot be told apart from absent in YAML, and
# the safe reading of it is the default rather than "everything is always
# stale". A negative value is a startup error.
fleet:
  # How long a proxy may be silent and still be routed through. Defaults to
  # 90s — several heartbeat intervals wide, so one lost packet does not take a
  # proxy out of routing.
  heartbeat_ttl: 90s

  # How long a reported relay registration stays believable. Shorter than
  # heartbeat_ttl on purpose: a registration is a live connection rather than a
  # fact about a configuration, so it is the thing most likely to have gone
  # away silently — and a relay hop over a dead registration hangs. A relay
  # edge whose registration has aged out drops out of routing and is NEVER
  # downgraded to a dial (proxy D11). Defaults to 60s.
  relay_registration_ttl: 60s

  # How long a target's reported enforcement capabilities stay fresh (M17).
  # Past it, the record provides nothing that has to be *applied* — the same
  # answer as an undated record or no record at all — while every rung that
  # needs nothing of the target stays available. Defaults to 24h.
  target_capability_ttl: 24h

  # How often this server asks a proxy to re-observe a target, answered in
  # `report_after_seconds`. The server owns the freshness of its own record: a
  # proxy may re-observe sooner, never later. Must be shorter than
  # target_capability_ttl, or every record expires between two reports and a
  # healthy fleet looks permanently stale. Defaults to 6h.
  capability_report_after: 6h

  # How many proxies one session may traverse, counting the entry proxy.
  # Defaults to 4, which is what the proxy's own routing.DefaultMaxHops
  # enforces. Do not set this above what your proxies enforce locally: this
  # server would answer routes they refuse, which is an outage in front of a
  # user rather than a message to you.
  max_hops: 4
