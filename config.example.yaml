# Hoplock Control — example configuration.
#
# Copy this file, edit it, and start the server with:
#
#     hoplock-control --config /etc/hoplock/control.yaml
#
# Decoding is strict: a key this file does not document is a startup error, not
# a silently ignored setting. Every field below is either required or has the
# default shown in its comment.

# The tenant this deployment operates as.
#
# The prototype is single-tenant and nothing in the API exposes tenancy, but
# every table carries the tenant column and every query filters on it (PLAN
# M12) — retrofitting that into a populated audit store later is a migration
# nobody wants to run. Optional; defaults to "default".
tenant: default

# The two listeners.
#
# South-bound (proxies) and north-bound (humans, CI, GitOps) never share a
# port, a middleware chain, or a credential type (PLAN M2). They are two
# fields from the first release because one field that later becomes two is a
# breaking config change. Both are required, and they must differ.
listeners:
  # Proxy-facing address, host:port. Speaks the vendored contract.
  south: 0.0.0.0:8443
  # Operator-facing address, host:port. Never route this from the south-bound
  # port: a proxy token that reaches a policy-authoring endpoint is privilege
  # escalation.
  north: 127.0.0.1:9443

# Postgres (PLAN M13). Required.
#
# The DSN normally carries a password, so keep this file out of version control
# (the repository's .gitignore already ignores config.yaml) and off any host
# where it need not be. The server never logs the DSN.
database:
  dsn: postgres://hoplock@localhost:5432/hoplock?sslmode=verify-full

# Structured logging. Optional.
log:
  # One of: debug, info, warn, error. Defaults to "info".
  level: info

# The fleet registry (PLAN M6, M17). Optional; every field has the default
# shown.
#
# These numbers decide what "stale" means, and stale is a routing decision: a
# proxy that has not been heard from is not a routing option, and routing
# through one is an outage the user experiences as a hang. They are
# configurable because the right values depend on how often your proxies
# heartbeat and how much loss your estate has. A key you leave out — or set to
# zero — takes its default: `0s` cannot be told apart from absent in YAML, and
# the safe reading of it is the default rather than "everything is always
# stale". A negative value is a startup error.
fleet:
  # How long a proxy may be silent and still be routed through. Defaults to
  # 90s — several heartbeat intervals wide, so one lost packet does not take a
  # proxy out of routing.
  heartbeat_ttl: 90s

  # How long a reported relay registration stays believable. Shorter than
  # heartbeat_ttl on purpose: a registration is a live connection rather than a
  # fact about a configuration, so it is the thing most likely to have gone
  # away silently — and a relay hop over a dead registration hangs. A relay
  # edge whose registration has aged out drops out of routing and is NEVER
  # downgraded to a dial (proxy D11). Defaults to 60s.
  relay_registration_ttl: 60s

  # How long a target's reported enforcement capabilities stay fresh (M17).
  # Past it, the record provides nothing that has to be *applied* — the same
  # answer as an undated record or no record at all — while every rung that
  # needs nothing of the target stays available. Defaults to 24h.
  target_capability_ttl: 24h

  # How often this server asks a proxy to re-observe a target, answered in
  # `report_after_seconds`. The server owns the freshness of its own record: a
  # proxy may re-observe sooner, never later. Must be shorter than
  # target_capability_ttl, or every record expires between two reports and a
  # healthy fleet looks permanently stale. Defaults to 6h.
  capability_report_after: 6h

  # How many proxies one session may traverse, counting the entry proxy.
  # Defaults to 4, which is what the proxy's own routing.DefaultMaxHops
  # enforces. Do not set this above what your proxies enforce locally: this
  # server would answer routes they refuse, which is an outage in front of a
  # user rather than a message to you.
  max_hops: 4

# The south-bound listener's bounds (PLAN M2, M5, phase 0007). Optional; every
# field has the default shown.
south:
  # The largest request body this listener accepts. Every south-bound payload
  # is a small JSON object. Defaults to 1048576 (1 MiB).
  max_body_bytes: 1048576

  # How long one request may take before this server ANSWERS rather than
  # hangs. A proxy holds a user's SSH handshake open while it waits, and a
  # timeout it can classify as an outage is strictly better than a slow answer
  # that looks like one. Defaults to 10s.
  request_timeout: 10s

# MFA orchestration (PLAN §6). Optional; every field has the default shown.
#
# The contract makes MFA entirely this server's concern: the proxy relays and
# polls, and never contacts a provider itself. These numbers are the terms of
# that conversation, and they are operational — the TTL is how long a user has
# to reach for their phone while their handshake is held open.
mfa:
  # How long a challenge stays answerable. Past it a poll is a DENY, never a
  # 200 that leaves the proxy polling forever. Defaults to 2m.
  challenge_ttl: 2m

  # The interval advertised to the proxy on the challenge. The proxy honours
  # it, so this — not the provider's patience — is what sets the load of an
  # outstanding challenge. Must be shorter than challenge_ttl. Defaults to 2s.
  poll_after: 2s

  # How many polls one challenge answers before it is abandoned. It bounds a
  # challenge's total cost independently of how fast it is polled. Defaults to
  # 120.
  max_polls: 120

# Ephemeral-uid allocation (PLAN §4, `POST /v1/uids/lease`). Optional; every
# field has the default shown.
#
# THE INVARIANT THESE NUMBERS SIT UNDER IS NOT CONFIGURABLE: the per-target
# cursor only ever advances, and a granted block is never reclaimed — used,
# abandoned or expired alike. There is no release call because there is nothing
# to give back. What you are choosing below is how much is granted at a time
# and out of what range.
uids:
  # The range allocated from when a proxy's lease names no bounds. A proxy that
  # states range_min/range_max overrides these, and this server never grants a
  # block outside what the proxy asked for: those bounds encode facts about
  # your fleet (above every distribution's UID_MAX, above systemd's
  # dynamic-user range, at the top of SSSD's id-mapping range, below 2^31) that
  # this server has no way to know. Default 2000000 / 2147483646.
  range_min: 2000000
  range_max: 2147483646

  # How many uids a block carries when the proxy asks for no particular size,
  # and the most one lease may take. `uid_count` on the request is a REQUEST,
  # not a requirement. A block is never reclaimed, so one oversized grant is
  # permanent — which is what max_block_size is for. Defaults: 4096 / 1048576.
  block_size: 4096
  max_block_size: 1048576

  # `term_seconds` on the response: how long a proxy may keep allocating from
  # the block it holds.
  #
  # ZERO IS THE DEFAULT AND IT MEANS "this server states no term", leaving the
  # proxy its own (a day). The term is NOT what makes the uids non-reusable —
  # the cursor above is — so an expired block is one the proxy stops using,
  # never one this server hands to somebody else. A block ends when it is
  # exhausted or when its term runs out, and both fail closed while this server
  # is unreachable, so shortening the term costs availability during exactly
  # the outage a held block exists to survive. Set it only if you have a reason
  # to be stricter than the proxy.
  lease_term: 0s

# The decision path (PLAN M5, §5.4, phase 0008). Optional; every field has the
# default shown, and a zero takes the default rather than disabling the bound.
#
# A proxy holds a user's SSH handshake open on every connection and per hop
# while this server answers, so what is configured here is how long that may
# take and how stale the material it is answered from may be.
decision:
  # How long a compiled policy bundle and a fleet graph are served before this
  # server re-reads which one is active. It is NOT a cache of answers: every
  # request is still evaluated against the policy, and this bounds only how
  # long after an activation the previous bundle may still be serving.
  # Defaults to 5s. A policy change that has to take effect NOW is a
  # revocation (M9), which travels on the event stream and has no cache in
  # front of it.
  refresh: 5s

  # The hard server-side deadline on one authorize call. A timeout the proxy
  # can classify as an outage beats a slow answer that looks like one. Keep it
  # well inside south.request_timeout, or it never fires first and is not a
  # deadline at all. Defaults to 2s.
  budget: 2s

  # The ceiling on a cache hint's lifetime. It clamps DOWNWARD only: a rule
  # asking for less gets what it asked for, and one asking for more gets this.
  #
  # The lifetime is policy's to set (PLAN §5.4) and this is not a second
  # opinion about it — it is the bound under which "we can withdraw this"
  # stays true, because a withdrawal travels over the revocation stream and a
  # decision cached for an hour outlives any reasonable bound on noticing that
  # the stream broke. Defaults to 5m.
  max_cache_ttl: 5m
