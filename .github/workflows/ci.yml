name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Enforce the floor rather than assert it.
  #
  # Without this, a job whose toolchain is older than the `go` directive in
  # go.mod silently downloads a newer one and passes — so the "floor" leg of
  # the matrix below would test the same toolchain as the "latest" leg and the
  # floor would drift upward without anyone deciding it should. GOTOOLCHAIN=local
  # makes that a build failure instead, which is the only way the floor stays
  # real. The Hoplock Proxy repository learned this the hard way; this comment is
  # what keeps it.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two legs on purpose (PLAN §8):
        #
        #   floor  — the `go` directive in go.mod, the oldest toolchain we
        #            promise to build on. It moves only when a dependency
        #            forces it, and this leg is what proves it still works.
        #   stable — the latest released Go, which is what contributors and
        #            distributions actually have. This leg catches a new vet
        #            check or a changed stdlib behaviour early rather than at
        #            the next floor bump.
        #
        # Keep the floor entry equal to the `go` directive in go.mod.
        go: ["1.27.0", "stable"]

    # A real Postgres, because the repository layer IS the SQL (PLAN M13,
    # §8): a fake tests the fake, and the two things in this schema that are
    # correct only because Postgres enforces them — the uid cursor's row lock
    # and the audit table's record_id uniqueness — are invisible to one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # storetest reads this. Unset, the Postgres-backed tests skip — and in
      # CI they FAIL instead, because a skipped test reads as a passing one in
      # the log and this is the leg that is supposed to run them.
      HOPLOCK_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          # Go stamps the binary's version from the repository's tags (PLAN
          # M23), so the job needs every tag and the history between them.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # Printed so a reader of the log can see which toolchain actually ran —
      # the floor leg must say the floor, not a downloaded newer version.
      - name: Report toolchain
        run: go version

      - name: Build
        run: make build

      # One build, one version (PLAN M23). Go stamps it from the tags, and the
      # Makefile no longer spells it another way. The second binary is built
      # outside the tree, which must stay clean or both would say +dirty.
      - name: Prove make build and go build report the same version
        run: |
          go build -o "$RUNNER_TEMP/hoplock-control" ./cmd/hoplock-control
          made="$(bin/hoplock-control --version)"
          built="$("$RUNNER_TEMP/hoplock-control" --version)"
          echo "make build: $made"
          echo "go build:   $built"
          test "$made" = "$built"
          # VERSION=... is the one override, for a build outside a git checkout.
          # The linker silently ignores an -X that names no variable, so prove
          # this one lands.
          make build VERSION=v0.0.0-override BIN_DIR="$RUNNER_TEMP/override"
          "$RUNNER_TEMP/override/hoplock-control" --version | grep -F 'hoplock-control v0.0.0-override '

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, and the pin is not free-floating: golangci-lint reads the
          # stdlib's export data with the importer it was *built* with, so a
          # linter older than the Go it lints fails every file with "could not
          # import ...". A patch release can do it too: go1.27.2 writes export
          # data version 5, which v2.13.2 cannot read and v2.14.0 can. Keep this
          # at a release that lints cleanly under the `stable` leg above, and
          # bump it in the same commit that moves the floor.
          version: v2.14.0

      # Checks the check. `exhaustive` is what holds M3's closed vocabulary
      # together (PLAN M13), so this writes a switch and a lookup map with a
      # missing enum member and fails unless the linter names both. It lives in
      # this job because it is the job with a linter in it.
      - name: Prove the exhaustive linter rejects an unhandled member
        run: make exhaustive-guard

  release-check:
    name: release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every v* tag, the base branch, and the history the check walks
          # (PLAN M23).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Says what merging this change releases, and refuses a version number
      # that does not match the change. On a pull request its log shows the tag
      # and the notes the merge will publish, and its last line is the one to
      # read. It never tags: the release job below does, after merge.
      - name: Check the release this change cuts
        run: make release-check

      # Checks the check, against a throwaway repository: one case per refusal,
      # and the release job's decision along a main branch's history.
      - name: Prove the release check refuses what it must
        run: make release-check-guard

  # The console's static checks (ui/DESIGN.md §10, PLAN M20, M21): each its
  # own job, so a failure names the rule it broke. None needs Go or a
  # database, and none is needed by `make build`, which embeds the committed
  # build in internal/console/dist and runs no Node.
  console-checks:
    name: console ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # §10.1: no colour, font size, radius or physical property outside
          # ui/src/styles/tokens.css.
          - check: token lint
            run: npm run lint:tokens
          # §10.2: every semantic pair, both themes, at the threshold that
          # applies to it, over the token file itself.
          - check: contrast
            run: npm run test:contrast
          # §10.9: no user-visible literal in a component, no formatting
          # outside the locale helpers; and the lint shown failing.
          - check: string lint
            run: npm run lint:strings
          # M21: en.json is the only catalogue, every key is referenced and
          # every referenced key exists, and en-XA accents and pads it all.
          - check: catalogue keys
            run: npm run test:catalogue
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the locked toolchain
        run: npm ci
      - name: Check ${{ matrix.check }}
        run: ${{ matrix.run }}

  # The console's build: typed, unit-tested, rebuilt from source and compared
  # with the committed internal/console/dist (§11's drift check), held to the
  # bundle budget, and built again under both pseudolocales (§10.7, §10.8),
  # whose builds 0050 renders. The pseudolocale builds are artefacts, never
  # committed: en.json is the only catalogue in the tree.
  console-build:
    name: console build, drift and budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the locked toolchain
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build the console from source
        run: npm run build
      - name: Prove the committed build is this source's
        run: |
          if ! git diff --quiet -- ../internal/console/dist || [ -n "$(git status --porcelain -- ../internal/console/dist)" ]; then
            git status --short -- ../internal/console/dist
            echo "internal/console/dist is not what ui/ builds: run 'npm run build' in ui/ and commit the result" >&2
            exit 1
          fi
      - name: Hold the bundle budget (§11)
        run: npm run budget
      - name: Build the pseudolocales (en-XA, en-XB)
        run: npm run build:pseudo
      - uses: actions/upload-artifact@v4
        with:
          name: console-pseudolocales
          path: ui/build/
          retention-days: 14

  # The console's browser checks (0050; DESIGN.md §10.3–§10.8), one job each
  # so a failure names its rule, every one over the registry of screens in
  # ui/e2e/screens.ts and against a real server on a seeded database
  # (ui/e2e/fixture/serve.sh, which Playwright starts). A later phase's screen
  # is covered by the design checks by registering it there; its own
  # acceptance spec runs only where an entry below names it, and
  # TestEveryConsoleSpecRunsInCI fails on a spec no entry names. A failing job
  # uploads its report and the actual, expected and diff images.
  console-e2e:
    name: console ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # §10.3: zero axe violations at serious or above, both themes, every state.
          - check: axe
            args: e2e/design.spec.ts --project checks -g "axe"
          # §10.4: the committed baseline, both themes and densities, loading,
          # empty and error; and two deployments told apart from the chrome.
          - check: screenshot baseline
            args: e2e/design.spec.ts e2e/identity.spec.ts --project checks -g "baseline|deployments"
          # §10.5: every external origin blocked; renders as the baseline does.
          - check: no network at runtime
            args: e2e/design.spec.ts --project checks -g "external origin"
          # §10.6: no transition or animation longer than 0ms under reduced motion.
          - check: reduced motion
            args: e2e/design.spec.ts --project checks -g "reduced motion"
          # §10.7: nothing unaccented, nothing clipped at +40%.
          - check: en-XA pseudolocale
            args: e2e/pseudo.spec.ts --project checks -g "en-XA"
          # §10.8: right-to-left, no physical property, every block mirrored.
          - check: en-XB mirrored
            args: e2e/pseudo.spec.ts --project checks -g "en-XB"
          # Fleet against the seeded database, and RBAC asserted at the API;
          # then the one mutation, on a fresh server of its own (--no-deps:
          # the mutations project otherwise runs every check before it).
          - check: fleet and RBAC
            args: e2e/fleet.spec.ts e2e/rbac.spec.ts --project checks
            then: npx playwright test e2e/mutations.spec.ts --project mutations --no-deps
          # Explain and the audit view against the seeded database (0051): the
          # whole story for an allow and a deny, deep links, paging to the
          # last page, the supervisor's word, replay, keyboard and 768px.
          - check: explain and audit
            args: e2e/explain-audit.spec.ts --project checks
          # Policy against the seeded database (0053): a rejection from its
          # code at its line, the unknown-code fallback, a refused upload
          # reported inline, an auditor refused at the API, the deep links.
          # The author's flow that changes the data runs in mutations, above.
          - check: policy
            args: e2e/policy.spec.ts --project checks
          # The account menu: theme and density chosen from the operator's
          # name, held across a reload. Signing in and out is in mutations.
          - check: account menu
            args: e2e/account.spec.ts --project checks
          # Standing denials and the directory's subjects (0055): a lock, a
          # quarantine and a deactivation as denies with their facts, the
          # levers offered to session:revoke alone, an undelivered lock in
          # force, a directory subject never edited, the claim mapping's
          # scoped entries and its refusals at their fields, the tie on the
          # sign-in page. Locking and quarantining for real is in mutations.
          - check: standing denials
            args: e2e/standing.spec.ts --project checks
          # Extensions and Reports (0056): the fixture host's sync running and
          # its action handler not started, a failing sink and a caught-up one,
          # a sink a retention pass overtook, every point empty and none
          # broken; a pack listed and generated with a parameter and a format,
          # a pack unavailable, a generation that broke shown as failed.
          - check: extensions and reports
            args: e2e/extensions-reports.spec.ts --project checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoplock_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      HOPLOCK_E2E_DSN: postgres://postgres:postgres@127.0.0.1:5432/hoplock_e2e?sslmode=disable
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the locked toolchain
        run: npm ci
      # The browser the pinned @playwright/test drives, with its system
      # libraries: the baseline was taken with this build.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.check }}
        run: npm run e2e -- ${{ matrix.args }}
      - name: Then
        if: matrix.then
        run: ${{ matrix.then }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-e2e-${{ strategy.job-index }}
          path: |
            ui/build/e2e/results/
            ui/build/e2e/report/
          retention-days: 14

  license:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check per-file SPDX headers
        run: make license-check

  contract:
    name: vendored contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Its own job, so the failure names itself. A local edit of
      # contract/control.yaml produces two green test suites and one broken
      # product (PLAN M1); this is the discovery point, and it reads very
      # differently as a job than as a line in the middle of a build log.
      - name: Check the vendored contract against contract/UPSTREAM
        run: make contract-check

  conform:
    name: conformance suite vs the proxy mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite is run against an implementation it was NOT written beside.
      # That is the whole point of running it here: a suite only ever pointed at
      # the server it grew up with tests agreement with itself (PLAN M1). The
      # mock already implements the contract, so a disagreement is a real
      # finding on one side or the other, and the PR says which.
      - name: Resolve the commit the contract was vendored from
        id: upstream
        run: |
          commit="$(sed -n -E 's/^commit=(.*)$/\1/p' contract/UPSTREAM)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "grading against hoplock/proxy@$commit"

      # Pinned to that commit rather than to a branch: grading the suite against
      # a mock built from a different revision of the contract would make an
      # upstream change look like a conformance failure here.
      - name: Check out the Hoplock Proxy repository (for cmd/mock-control)
        uses: actions/checkout@v4
        with:
          repository: hoplock/proxy
          ref: ${{ steps.upstream.outputs.commit }}
          path: .proxy

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The mock's certificate authority signs with a key generated here, so
      # no private key is ever checked in (mock-fixtures.yaml names the path).
      - name: Build and start the mock control server
        run: |
          mkdir -p .mock-ca
          ssh-keygen -q -t ed25519 -N '' -f .mock-ca/ca_ed25519
          go -C .proxy build -o "$GITHUB_WORKSPACE/mock-control" ./cmd/mock-control
          ./mock-control -listen 127.0.0.1:8080 \
            -fixtures cmd/pdpconform/testdata/mock-fixtures.yaml &
          up=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/debug/logs; then
              up=1
              break
            fi
            sleep 0.5
          done
          if [ "$up" -ne 1 ]; then
            echo "mock-control did not come up" >&2
            exit 1
          fi

      # -v prints the details of PASSING assertions too, so a reader of the log
      # can see a case graded something rather than passing vacuously.
      - name: Run the conformance suite
        run: |
          make conform \
            BASE_URL=http://127.0.0.1:8080 \
            TOKEN=pdpconform-dev-token \
            EXPECT=cmd/pdpconform/testdata/mock-expectations.yaml \
            CONFORM_FLAGS=-v

  conform-self:
    name: conformance suite vs this server
    runs-on: ubuntu-latest

    # The same suite, pointed at the real implementation. The job above keeps
    # the SUITE honest by grading a server it was not written beside; this one
    # is what grades US (PLAN M1), and phase 0007 is the first phase with
    # anything for it to grade.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoplock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The server reads its own configuration file, so the leg exercises the
      # real startup path rather than a test harness that happens to share a
      # package with it.
      - name: Write the server's configuration
        run: |
          cat > ci-config.yaml <<'YAML'
          tenant: default
          listeners:
            south: 127.0.0.1:8080
            north: 127.0.0.1:8081
          database:
            dsn: postgres://postgres:postgres@127.0.0.1:5432/hoplock?sslmode=disable
          log:
            level: info
          # The tenant's certificate authority, for the brokered-certificate
          # cases: its private half is encrypted under a key-encryption key
          # this job generates and hands the server through the environment.
          credential:
            key_encryption_key_env: HOPLOCK_KEK
          # No debug listeners: since 0019 the suite publishes events and
          # reads records back over the north-bound API (127.0.0.1:8081),
          # under scoped API tokens control-seed.yaml seeds.
          YAML

      # Migrations are an explicit command and never run on boot (PLAN §8), so
      # the leg runs them the way an operator does.
      - name: Apply migrations
        run: go run ./cmd/hoplock-control migrate --config ci-config.yaml

      # The fixtures the expectation file describes, including the scoped
      # north-bound API tokens the suite publishes and reads through. `seed`
      # is the bootstrap path — the API cannot mint its own first credential —
      # see internal/daemon/seed.go for why that is not a back door.
      - name: Seed the fixtures the suite expects
        run: |
          go run ./cmd/hoplock-control seed \
            --config ci-config.yaml \
            --file cmd/pdpconform/testdata/control-seed.yaml

      - name: Start the server
        run: |
          go build -o hoplock-control ./cmd/hoplock-control
          HOPLOCK_KEK="$(head -c 32 /dev/urandom | base64)" \
            ./hoplock-control --config ci-config.yaml > server.log 2>&1 &
          up=0
          for _ in $(seq 1 60); do
            # A 401 is the listener answering: every route is behind the proxy
            # credential, so an unauthenticated probe reaching the error
            # envelope means the server is up and the chain is wired.
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/cert || true)"
            if [ "$code" = "401" ]; then
              up=1
              break
            fi
            sleep 0.5
          done
          if [ "$up" -ne 1 ]; then
            echo "the server did not come up" >&2
            cat server.log >&2
            exit 1
          fi

      # -only names the groups this build serves, and that is EVERY group the
      # suite has: `error` is the error discipline (M11), which went unnamed
      # here from 0007 to 0020 and so was never run against this server. The
      # filter is kept for the shape of the command rather than to exclude
      # anything: a group added to the suite has to be named here
      # deliberately, which is the point, and main.go's group list is what to
      # check this one against.
      #
      # `authorize` covers four groups at once — the envelope, the absent-value
      # defaults, vocabulary negotiation and the device-field namespace — all
      # graded against the routes in control-expectations.yaml and the policy in
      # control-policy.yaml.
      - name: Run the conformance suite against this server
        run: |
          make conform \
            BASE_URL=http://127.0.0.1:8080 \
            TOKEN=default.pdpconform-dev-secret \
            EXPECT=cmd/pdpconform/testdata/control-expectations.yaml \
            CONFORM_FLAGS='-v -only=authentication,authorize,host,capabilities,uid,logs,revocation,fleet,brokered,algorithm,error'

      # The server's own log, so a failure above can be read against what it
      # thought it was doing.
      - name: Print the server log
        if: always()
        run: cat server.log

  # Cuts the release a merged change names (PLAN M23): an annotated tag on the
  # merge commit, a GitHub Release with the same notes, and proof that the
  # version resolves through the public module proxy, which is what Hoplock
  # Enterprise pins (its E3).
  #
  # It is the only job that writes. No session and no person pushes a tag: the
  # module is public (M14), so a version's content is fixed the first time
  # anyone fetches it, and the checksum database records it. So a tag is cut
  # only here, on the commit every other job has just passed on. A bad release
  # is superseded and retracted in go.mod, never moved.
  #
  # When this job fails, fix the cause and re-run it ON THE SAME COMMIT. If
  # creating the tag is refused (a repository setting), fix the setting and
  # re-run. Never push the tag by hand, and never at another commit. A re-run on
  # a commit that is already tagged resumes: it publishes the GitHub Release and
  # proves the proxy, without tagging again.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, release-check, license, contract, conform, conform-self, console-checks, console-build, console-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two merges in quick succession must not race for one version, and the
    # second must see the tag the first pushed, so they run one at a time. A
    # run still waiting when a third arrives is cancelled by GitHub; the next
    # run then fails and names the commit to re-run, as for any release left
    # behind.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The pushed commit, never a branch head read again later: the tag
          # records what review approved, at the commit that was checked.
          ref: ${{ github.sha }}
          # The tags, and main's history: how this job tells the merge that
          # introduced a version from a later commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # "release vX.Y.Z" when this push introduced a version with no tag;
      # "resume vX.Y.Z" when this commit already carries that tag; "nothing"
      # otherwise. A later push while a version is still untagged is a release
      # left behind, and the script refuses it and names the commit to re-run:
      # tagging this one would publish content the release's section does not
      # describe. It asks about the push (BEFORE..GITHUB_SHA), not the commit's
      # parent, so a rebase merge, whose middle commits get no run, still works.
      - name: Decide what this commit releases
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          plan="$(scripts/release-check.sh plan "$GITHUB_SHA" "$BEFORE")"
          echo "plan for $GITHUB_SHA: $plan"
          case "$plan" in
            nothing) ;;
            "release v"* | "resume v"*)
              echo "action=${plan%% *}" >> "$GITHUB_OUTPUT"
              echo "version=${plan#* }" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "unexpected plan: $plan" >&2; exit 1 ;;
          esac

      - name: Write the release notes
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          scripts/release-check.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          { printf '## %s\n\n' "$VERSION"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/tag-message.md"
          cat "$RUNNER_TEMP/tag-message.md"

      # Annotated, with the release's changelog section as its message.
      # --cleanup=verbatim, because by default git strips every line that
      # begins with '#' from a tag message, which is every heading in it.
      - name: Tag the merge commit
        if: steps.plan.outputs.action == 'release'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --cleanup=verbatim --file "$RUNNER_TEMP/tag-message.md" "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      # --verify-tag: the API must never create the tag itself, because it
      # would put it on the branch head rather than on this commit.
      - name: Publish the GitHub Release
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "the GitHub Release $VERSION exists already"
          else
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # What Enterprise's E3 needs, proven at the moment the version is made:
      # it is fetchable by path through the public proxy, and recorded in the
      # checksum database, which `go mod download` consults for a module it has
      # never seen. Bounded, because a new tag can take minutes to reach the
      # proxy. If it runs out, re-run this job on this commit: it resumes.
      - name: Resolve the version through the module proxy
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          module="$(go list -m)"
          cd "$RUNNER_TEMP"
          for delay in 0 10 20 40 60 120 120 120 120 120 120 120; do
            sleep "$delay"
            if out="$(go mod download -json "$module@$VERSION")" && ! grep -q '"Error"' <<<"$out"; then
              echo "$out"
              echo "$module@$VERSION resolves through $GOPROXY"
              exit 0
            fi
            echo "$module@$VERSION does not resolve yet:" >&2
            echo "$out" >&2
          done
          echo "$module@$VERSION did not resolve through $GOPROXY: re-run this job on $GITHUB_SHA" >&2
          exit 1
